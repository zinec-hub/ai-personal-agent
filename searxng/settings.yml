use_default_settings: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "change-me-to-a-random-string"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

engines:
  # 中文搜索
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: baidu
    engine: baidu
    shortcut: bd
    disabled: false

  # 英文/通用搜索
  - name: google
    engine: google
    shortcut: go
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  useragent_suffix: ""
  # 如果国内直连 Google 困难，可配置代理
  # proxies:
  #   all://:
  #     - socks5h://127.0.0.1:1080
